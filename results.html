<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="overlay"></div>
<h1 class="title">Search Results</h1>
<div class="form-container">
    {% if results %}
        <ul>
        {% for case in results %}
            <li><b>{{ case['title'] }}</b><br>{{ case['summary'][lang] }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No results found.</p>
    {% endif %}
</div>
</body>
</html>
